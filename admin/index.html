<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VStore Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#1b211d;font:14px system-ui,Segoe UI,sans-serif}header{background:#fff;border-bottom:1px solid #e5e9e4;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}header b{font-size:20px}header span{color:#788078;font-size:12px}main{max-width:1140px;margin:28px auto;padding:0 20px}.status{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}.pill{background:#fff;border:1px solid #e5e9e4;border-radius:10px;padding:10px 13px;font-size:12px}.pill.ok{color:#176d4d}.pill.bad{color:#9a542c}.layout{display:grid;grid-template-columns:230px 1fr;gap:20px}.nav,.panel{background:#fff;border:1px solid #e5e9e4;border-radius:15px;padding:17px}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.nav button.active{background:#eaf4ed;color:#176d4d;font-weight:700}.panel h1{font-size:23px;margin:3px 0 6px}.muted{color:#7c857e;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#176d4d;color:#fff}.soft{background:#f0f3f0}.danger{color:#a44136;background:#fff1ef}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #edf0ed;padding:12px 8px;font-size:12px}.table th{color:#7b837d;font-weight:500}.badge{border-radius:20px;padding:4px 8px;background:#f1f3f1;font-size:10px}.badge.published{color:#176d4d;background:#eaf4ed}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:11px;color:#606b63}.field input,.field textarea,.field select{border:1px solid #dfe5df;border-radius:8px;padding:10px;font:inherit;font-size:12px;background:white}.field textarea{min-height:88px;resize:vertical}.filebox{background:#f8faf8;padding:14px;border:1px dashed #cbd5cc;border-radius:10px}.actions{display:flex;gap:8px;margin-top:17px}.log{padding:10px 12px;background:#f6f8f6;border-radius:8px;font-size:12px;margin-top:7px}.modal{position:fixed;inset:0;background:#17231d66;display:grid;place-items:center;padding:18px;z-index:2}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:22px}.hidden{display:none}.check{display:flex;gap:9px;font-size:12px;align-items:start}.notice{background:#fbf6e9;border:1px solid #eee1c7;padding:12px;border-radius:9px;font-size:11px;color:#72613d;margin:13px 0}.error{background:#fff0ef;color:#923f35;padding:10px;border-radius:8px}.success{background:#e9f5ed;color:#176d4d;padding:10px;border-radius:8px}@media(max-width:750px){main{padding:0 12px;margin:18px auto}.layout{grid-template-columns:1fr}.nav{display:flex;padding:6px;gap:4px}.nav button{width:auto;flex:1;text-align:center}.panel{padding:14px}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.table th:nth-child(3),.table td:nth-child(3){display:none}header{padding:13px 16px}}
</style></head><body><header><b>◈ VStore <span>ADMIN</span></b><span id="connection">Проверяю подключение…</span></header><main><div id="status" class="status"></div><div class="layout"><nav class="nav"><button class="active" data-tab="dashboard">Обзор</button><button data-tab="apps">Приложения</button><button data-tab="categories">Категории</button><button data-tab="settings">Настройки</button></nav><section class="panel" id="content"></section></div></main><div id="modal" class="modal hidden"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="formTitle">Новое приложение</h2><button class="button soft" onclick="closeForm()">Закрыть</button></div><form id="appForm"><input type="hidden" name="editing"><div class="form-grid"><div class="field"><label>ID для ссылки и тега релиза *</label><input name="id" required placeholder="my-app-1"></div><div class="field"><label>Название *</label><input name="name" required></div><div class="field"><label>Разработчик *</label><input name="developer" required></div><div class="field"><label>Bundle ID *</label><input name="bundleId" required placeholder="com.example.app"></div><div class="field"><label>Версия *</label><input name="version" required placeholder="1.0.0"></div><div class="field"><label>Категория *</label><select name="category" id="category" required></select></div><div class="field"><label>Минимальная версия iOS</label><input name="iosMinimum" value="16.0"></div><div class="field wide"><label>Описание *</label><textarea name="description" required></textarea></div><div class="field"><label>Источник IPA</label><input name="source" placeholder="Ссылка или описание происхождения"></div><div class="field"><label>Иконка (путь или URL)</label><input name="icon" value="/icons/app-notes.svg"></div><div class="field wide filebox"><label>Файл IPA — расчёт SHA‑256 и проверка структуры</label><input type="file" id="ipa" accept=".ipa,application/octet-stream"><div id="ipaResult" class="muted"></div></div><div class="field wide"><label class="check"><input type="checkbox" name="distributionPermission"> Подтверждаю наличие права на распространение этого приложения.</label></div><div class="field wide"><label class="check"><input type="checkbox" name="featured"> Показывать на главной.</label></div></div><div id="formMessage"></div><div class="actions"><button class="button soft" type="button" onclick="saveDraft()">Сохранить черновик</button><button class="button primary" type="button" onclick="publishApp()">Опубликовать</button></div></form><div id="progress"></div></div></div><script>
const $=s=>document.querySelector(s),content=$('#content');let state={apps:[],categories:[],ipa:null,status:{}};async function api(url,options={}){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{state.status=await api('/api/status');state={...state,...await api('/api/apps')};renderStatus();showTab('dashboard')}catch(e){$('#connection').textContent=e.message;$('#status').innerHTML='<div class="pill bad">Сервер не готов: '+esc(e.message)+'</div>'}}function renderStatus(){const s=state.status;$('#connection').textContent=s.auth?'GitHub: '+(s.repo||s.user):'GitHub не подключён';$('#status').innerHTML=[['Git',s.git],['GitHub CLI',s.gh],['Авторизация',s.auth],['Репозиторий',!!s.repo]].map(([n,v])=>`<div class="pill ${v?'ok':'bad'}">${v?'✓':'!'} ${n}: ${v?'подключён':'не настроен'}</div>`).join('')+(!s.auth?`<div class="pill bad">${esc(s.installation||'')}</div>`:'')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));function showTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='dashboard'){const published=state.apps.filter(a=>a.status==='published').length,draft=state.apps.filter(a=>a.status==='draft').length;content.innerHTML=`<h1>Обзор</h1><p class="muted">Локальная панель VStore · ${new Date().toLocaleDateString('ru-RU')}</p><div class="status"><div class="pill">Всего приложений: <b>${state.apps.length}</b></div><div class="pill ok">Опубликовано: <b>${published}</b></div><div class="pill">Черновики: <b>${draft}</b></div></div><h3>Последние записи</h3>${state.apps.slice(0,5).map(a=>`<div class="log"><b>${esc(a.name)}</b> · ${esc(a.version)} · ${esc(a.status)}</div>`).join('')||'<p class="muted">Записей пока нет.</p>'}<div class="notice">Публикация требует установленного Git, GitHub CLI, авторизации через <code>gh auth login</code> и подключённого репозитория.</div>`}else if(tab==='apps')renderApps();else if(tab==='categories')renderCategories();else content.innerHTML=`<h1>Настройки</h1><p class="muted">Локальный сервер слушает только 127.0.0.1:4178. Секреты в frontend не передаются.</p><div class="notice">${esc(state.status.installation||'GitHub подключён через официальный GitHub CLI.')}</div><p>Категории редактируются в <code>data/categories.json</code>. Настройте URL и репозиторий в vite.config.ts и GitHub Actions перед публикацией GitHub Pages.</p><button class="button soft" onclick="load()">Обновить состояние</button>`}
function renderCategories(){content.innerHTML=`<h1>Категории</h1><p class=\"muted\">Общий список в data/categories.json</p><div class=\"toolbar\"><span></span><button class=\"button primary\" onclick=\"editCategory()\">＋ Добавить категорию</button></div><table class=\"table\"><thead><tr><th>Категория</th><th>ID</th><th></th></tr></thead><tbody>${state.categories.map(c=>`<tr><td>${esc(c.icon)} ${esc(c.name)}<br><span class=\"muted\">${esc(c.description)}</span></td><td>${esc(c.id)}</td><td><button class=\"button soft\" onclick=\"editCategory('${esc(c.id)}')\">Изменить</button> <button class=\"button danger\" onclick=\"deleteCategory('${esc(c.id)}')\">Удалить</button></td></tr>`).join('')}</tbody></table>`}async function editCategory(id){const c=state.categories.find(x=>x.id===id)||{id:'',name:'',icon:'＋',description:''};const name=prompt('Название категории',c.name);if(name===null)return;let slug=c.id;if(!slug)slug=prompt('ID (латиница, цифры и дефис)',name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));if(slug===null)return;const description=prompt('Краткое описание',c.description);if(description===null)return;const icon=prompt('Иконка (символ)',c.icon);if(icon===null)return;try{const d=await api('/api/categories/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:slug,name,description,icon})});state.categories=d.categories;renderCategories()}catch(e){alert(e.message)}}async function deleteCategory(id){if(!confirm('Удалить категорию?'))return;try{const d=await api('/api/categories/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});state.categories=d.categories;renderCategories()}catch(e){alert(e.message)}}
function renderApps(){content.innerHTML=`<h1>Приложения</h1><div class="toolbar"><span class="muted">${state.apps.length} записей в data/apps.json</span><button class="button primary" onclick="openForm()">＋ Добавить приложение</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Название</th><th>Версия</th><th>Статус</th><th>Действия</th></tr></thead><tbody>${state.apps.map(a=>`<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.developer)}</span></td><td>${esc(a.version)}</td><td><span class="badge ${a.status}">${esc(a.status==='published'?'опубликовано':a.status==='demo'?'DEMO':'черновик')}</span></td><td><button class="button soft" onclick="editApp('${esc(a.id)}')">Изменить</button> <button class="button danger" onclick="deleteApp('${esc(a.id)}')">Удалить</button></td></tr>`).join('')}</tbody></table></div>`}
function openForm(app=null){$('#appForm').reset();state.ipa=null;$('#ipaResult').textContent='';$('#progress').innerHTML='';$('#formMessage').innerHTML='';$('#formTitle').textContent=app?'Изменить приложение':'Новое приложение';$('#category').innerHTML=state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('#appForm').elements.editing.value=app?.id||'';if(app)for(const k of ['id','name','developer','bundleId','version','category','iosMinimum','description','source','icon'])$('#appForm').elements[k].value=app[k]||'';if(app){$('#appForm').elements.featured.checked=app.featured;$('#appForm').elements.distributionPermission.checked=app.distributionPermission}$('#modal').classList.remove('hidden')}
function closeForm(){$('#modal').classList.add('hidden')}function editApp(id){openForm(state.apps.find(a=>a.id===id))}function values(){const f=$('#appForm');const v=Object.fromEntries(new FormData(f).entries());const id=v.editing||String(v.name).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const prior=state.apps.find(a=>a.id===id);return {...prior,...v,id,popularity:prior?.popularity||0,featured:f.elements.featured.checked,status:prior&&prior.version===v.version?prior.status:'draft',distributionPermission:f.elements.distributionPermission.checked||!!prior?.distributionPermission,icon:v.icon||prior?.icon||'/icons/app-notes.svg',screenshots:prior?.screenshots||[],size:prior?.size??null,downloadUrl:prior?.downloadUrl??null,sha256:prior?.sha256??null,source:v.source||prior?.source||'Не указан',changelog:prior?.changelog||[]}}
async function saveDraft(){try{const r=await api('/api/apps/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(values())});state.apps=r.apps;$('#formMessage').innerHTML='<p class="success">Черновик сохранён в data/apps.json.</p>';setTimeout(()=>{closeForm();showTab('apps')},700)}catch(e){$('#formMessage').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
$('#ipa').addEventListener('change',async e=>{const file=e.target.files[0];state.ipa=null;if(!file)return;$('#ipaResult').textContent='Проверяю структуру IPA и рассчитываю SHA-256…';const form=new FormData();form.append('ipa',file);try{const d=await api('/api/ipa/inspect',{method:'POST',body:form});state.ipa=d;$('#ipaResult').innerHTML=`Файл: ${esc(d.filename)} · ${(d.size/1048576).toFixed(2)} МБ<br>SHA-256: <code>${esc(d.sha256)}</code><br>Структура IPA подтверждена.${d.metadata.bundleId?`<br>Bundle ID: ${esc(d.metadata.bundleId)} · версия ${esc(d.metadata.version)} · ${esc(d.metadata.name)}`:''}`;for(const key of ['bundleId','version','name','iosMinimum'])if(d.metadata[key]&&$('#appForm').elements[key]&&!$('#appForm').elements[key].value)$('#appForm').elements[key].value=d.metadata[key]}catch(err){$('#ipaResult').textContent=err.message}});
async function publishApp(){const v=values();if(!v.distributionPermission){$('#formMessage').innerHTML='<p class="error">Подтвердите право на распространение IPA.</p>';return}if(!v.source||v.source==='Не указан'){ $('#formMessage').innerHTML='<p class="error">Укажите источник IPA.</p>';return}if(!state.ipa){$('#formMessage').innerHTML='<p class="error">Выберите и проверьте IPA.</p>';return}try{const saved=await api('/api/apps/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(v)});state.apps=saved.apps;$('#progress').innerHTML='<div class="log">✓ Обязательные поля и разрешение проверены</div><div class="log">✓ SHA-256 и структура IPA проверены</div><div class="log">… Создание GitHub Release, обновление JSON и отправка commit</div>';const result=await api('/api/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:v.id,file:state.ipa.file,notes:'Релиз VStore '+v.version,source:v.source,distributionPermission:v.distributionPermission})});$('#progress').innerHTML=result.milestones.map(m=>`<div class="log">${m.state==='done'?'✓':'!'} ${esc(m.step)}: ${esc(m.detail)}</div>`).join('');$('#formMessage').innerHTML='<p class="success">IPA опубликован в GitHub Releases. Публикация сайта запущена.</p>';state.apps=await api('/api/apps').then(d=>d.apps);setTimeout(()=>{closeForm();showTab('apps')},1300)}catch(e){$('#formMessage').innerHTML='<p class="error">'+esc(e.message)+'</p>';$('#progress').innerHTML+='<div class="log">Проверьте сообщение об ошибке и состояние GitHub CLI/репозитория.</div>'}}
async function deleteApp(id){if(!confirm('Удалить запись из каталога?'))return;try{await api('/api/apps/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});state.apps=state.apps.filter(a=>a.id!==id);renderApps()}catch(e){alert(e.message)}}load();</script></body></html>
